name: BT-BACKUP-DIAG - Read-only pooler connection comparison

# Manual only. No pg_dump, rclone, SQL writes or automatic triggers.
on:
  workflow_dispatch:
    inputs:
      confirm_readonly_probe:
        description: Authorize two SELECT 1 probes against the existing Supabase pooler
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bytetorque-readonly-pooler-diagnostic
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'Danielsanchezdesarrolador/biomotors-taller' &&
          github.actor == 'Danielsanchezdesarrolador' &&
          github.ref == 'refs/heads/main' && inputs.confirm_readonly_probe == true }}
    runs-on: ubuntu-latest
    environment: bytetorque-backup-export
    timeout-minutes: 5
    container:
      image: postgres:17-bookworm
    steps:
      - name: Checkout pinned commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install Python before loading any secrets
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3
      - name: Offline diagnostic tests before secrets
        run: python3 -B scripts/backup/test_postgres_preflight.py
      - name: Compare two read-only authenticated TLS probes
        timeout-minutes: 2
        env:
          BT_BACKUP_PGPASS_CONTENT: ${{ secrets.BT_BACKUP_PGPASS_CONTENT }}
          BT_BACKUP_PG_CA_PEM: ${{ secrets.BT_BACKUP_PG_CA_PEM }}
        run: python3 -B scripts/backup/readonly_pooler_diagnostic.py
