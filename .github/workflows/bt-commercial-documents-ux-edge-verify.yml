name: ByteTorque DOCUMENTS-UX-01 - Edge VERIFY
on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'VERIFY_PACKAGE_ONLY (sin despliegue)'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: bytetorque-commercial-edge-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPROVED_SHA: fb261a391a68bfe948657e3f4e4fbaefb26eec9c
      PACKAGE: /tmp/bt-documents-ux-verify-${{ github.run_id }}-${{ github.run_attempt }}
      CONFIRMATION: ${{ inputs.confirmacion }}
      REQUEST_REF: ${{ github.ref }}
    steps:
      - name: Reject any unauthorized ref or confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUEST_REF" == refs/heads/main ]]
          [[ "$CONFIRMATION" == VERIFY_PACKAGE_ONLY ]]
      - uses: actions/checkout@v4
        with:
          ref: fb261a391a68bfe948657e3f4e4fbaefb26eec9c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact reviewed sources and packages
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]]
          npm ci --no-audit --no-fund
          git diff --exit-code
          git diff --cached --exit-code
          node scripts/package-commercial-handlers.mjs "$PACKAGE"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {readFile,readdir,writeFile} from 'node:fs/promises'
          import {createHash} from 'node:crypto'
          import {join} from 'node:path'
