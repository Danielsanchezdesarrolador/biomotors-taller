          const actual = JSON.parse(await readFile(join(process.env.PACKAGE,'release-manifest.json'),'utf8'))
          assert.deepEqual(actual,expected,'REVIEW_MANIFEST_MISMATCH')
          const sha = bytes => createHash('sha256').update(bytes).digest('hex')
          const sourcePaths = Object.keys(expected.sourceHashes)
          const packagePaths = Object.keys(expected.files)
          assert.equal(sourcePaths.length,15)
          assert.equal(packagePaths.length,43)
          for (const [p,h] of Object.entries(expected.sourceHashes)) assert.equal(sha(await readFile(p)),h,p)
          for (const [p,h] of Object.entries(expected.files)) assert.equal(sha(await readFile(join(process.env.PACKAGE,p))),h,p)
          const found = []
          async function walk(root,prefix='') {
            for(const e of await readdir(root,{withFileTypes:true})){
              const relative=prefix+e.name
              if(e.isDirectory()) await walk(join(root,e.name),relative+'/')
              else if(e.isFile()) found.push(relative)
              else throw Error('NON_REGULAR_PACKAGE_ENTRY')
            }
          }
          await walk(process.env.PACKAGE)
          assert.deepEqual(found.sort(),[...packagePaths,'release-manifest.json'].sort(),'PACKAGE_INVENTORY_MISMATCH')
          await writeFile(join(process.env.PACKAGE,'verify-receipt.json'),JSON.stringify({status:'PASS',sha:process.env.APPROVED_SHA,reviewManifestBlob:'3a2f7cdb1ced86672ddc41714e84bfabf6c42495',sources:15,files:43,manifestEqual:true,deployed:false},null,2)+'\n')
