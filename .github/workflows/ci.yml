name: Verificación ByteTorque
on:
  push:
    branches: [main]
    # Se omite solo documentacion pura. SQL, codigo, scripts y workflows SI se prueban.
    paths-ignore:
      - '**/*.md'
      - 'docs/checkpoints/**'
      - 'docs/screenshots/**'
      - 'docs/qa/**'
  pull_request:
concurrency:
  # En push, solo el HEAD mas nuevo necesita el resultado de este workflow.
  # Las ejecuciones manuales y PR mantienen grupos unicos independientes.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
jobs:
  web-ios-pwa:
    name: Web / iOS PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias web
        run: npm install --no-audit --no-fund
      - name: Validar sintaxis de prueba de seguridad A/B (sin ejecutar acceso real)
        run: node --check scripts/security/bt-cp02-ab.mjs
      - name: Verificar TypeScript web
        run: npm run typecheck
      - name: Pruebas web
        run: npm test
      - name: Build PWA
        run: npm run build
      - name: Comprobar build de directorio CP03 privado sin publicarlo
        env:
          VITE_BT_AUTH_R1_ENABLED: 'true'
          VITE_BT_CP03_PRIVATE_ENABLED: 'true'
          VITE_SUPABASE_URL: 'https://suxcqqnmcjoezfxltoms.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_build_only'
        run: npm run build
      - name: Compilar CP04 privado candidato SIN publicarlo
        env:
          VITE_BT_AUTH_R1_ENABLED: 'true'
          VITE_BT_CP03_PRIVATE_ENABLED: 'true'
          VITE_BT_CP04_PRIVATE_ENABLED: 'true'
          VITE_SUPABASE_URL: 'https://suxcqqnmcjoezfxltoms.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_build_only'
        run: npm run build
      - name: Compilar CP05/CP06 candidatos sin activar servicios
        env:
          VITE_BT_AUTH_R1_ENABLED: 'true'
          VITE_BT_CP03_PRIVATE_ENABLED: 'true'
          VITE_BT_CP04_PRIVATE_ENABLED: 'true'
          VITE_BT_CP05_PRIVATE_ENABLED: 'true'
          VITE_BT_CP06_PRIVATE_ENABLED: 'true'
          VITE_BT_CP05_DOCUMENTS_ENABLED: 'true'
          VITE_BT_CP05_EMAIL_ENABLED: 'true'
          VITE_SUPABASE_URL: 'https://suxcqqnmcjoezfxltoms.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_build_only'
        run: npm run build
  android-native:
    name: Android React Native / Expo (sin generar APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Instalar dependencias Android
        run: npm install --no-audit --no-fund
        working-directory: apps/android
      - name: Verificar TypeScript Android
        run: npm run typecheck
        working-directory: apps/android
      - name: Verificar compatibilidad de paquetes Expo
        run: npx expo install --check
        working-directory: apps/android
      - name: Generar bundle Android para validación (no APK)
        run: npx expo export --platform android --output-dir dist-android
        working-directory: apps/android
      - name: Verificar configuración nativa y perfil APK
        run: npm run verify-config
        working-directory: apps/android
