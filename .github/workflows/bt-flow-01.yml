name: BT-FLOW-01 — Recepción y continuidad DEMO
on:
  push:
    branches: [main]
    paths:
      - 'src/flow/**'
      - 'src/session/**'
      - 'src/App.tsx'
      - 'src/clientes/**'
      - 'src/ordenes/orderSession.ts'
      - 'src/ordenes/OrdenesPanel.tsx'
      - 'src/informes/InformesPanel.tsx'
      - 'src/informes/documentosData.ts'
      - 'scripts/verify-flow-ui.cjs'
      - 'scripts/verify-flow-d-ui.cjs'
      - 'scripts/verify-qa02-ui.cjs'
      - 'scripts/verify-qa02-print.cjs'
      - 'scripts/analyze-qa02-pdfs.py'
      - 'src/informes/trabajos/**'
      - '.github/workflows/bt-flow-01.yml'
      - 'tests/**'
      - 'src/layout/**'
      - 'vite.harness.config.ts'
      - 'vitest.config.ts'
  workflow_dispatch:
concurrency:
  # En push, solo el HEAD mas nuevo necesita el resultado de este workflow.
  # Las ejecuciones manuales y PR mantienen grupos unicos independientes.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
jobs:
  recepcion-expediente-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Preparar aplicación y Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Comprobar vínculos, visitas y reanudación en cinco tamaños
        run: |
          npm run dev:harness -- --port 5177 --strictPort > /tmp/bytetrq-flow-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5177/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-flow-ui.cjs
          node scripts/verify-flow-d-ui.cjs
          node scripts/verify-qa02-ui.cjs
          node scripts/verify-qa02-print.cjs
      - name: Analizar páginas A4 y descartar hojas vacías
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 scripts/analyze-qa02-pdfs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BT-FLOW-01-Recepcion-Expediente-Capturas
          path: |
            artifacts/bt-flow-01/
            artifacts/bt-flow-01d/
            artifacts/bt-qa02/
            artifacts/bt-qa02-print/
          if-no-files-found: warn
          retention-days: 30
