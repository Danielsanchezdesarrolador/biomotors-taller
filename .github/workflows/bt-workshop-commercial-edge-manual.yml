name: ByteTorque COMMERCIAL-01 - Edge manual
on:
  workflow_dispatch:
    inputs:
      fase:
        description: 'Congelar o instalar tres servicios; Dirección Técnica comprueba puertas SQL antes'
        required: true
        type: choice
        options:
          - freeze
          - ready
      confirmacion:
        description: 'FREEZE_GATE_VERIFIED o READY_SQL_GATE_VERIFIED según fase'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bytetorque-commercial-edge-release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && ((inputs.fase == 'freeze' && inputs.confirmacion == 'FREEZE_GATE_VERIFIED') || (inputs.fase == 'ready' && inputs.confirmacion == 'READY_SQL_GATE_VERIFIED')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: suxcqqnmcjoezfxltoms
      APPROVED_SHA: 3c77ca83ee2d6db62e0ad2c66ccfa6aa61294c4c
      PACKAGE: /tmp/bt-commercial-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3c77ca83ee2d6db62e0ad2c66ccfa6aa61294c4c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify pinned sources and reproduce reviewed packages offline
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]]
          docker info >/dev/null
          npm ci --no-audit --no-fund
          git diff --exit-code
          node scripts/package-commercial-handlers.mjs "$PACKAGE"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {readFile} from 'node:fs/promises'
          import {createHash} from 'node:crypto'
          import {join} from 'node:path'
