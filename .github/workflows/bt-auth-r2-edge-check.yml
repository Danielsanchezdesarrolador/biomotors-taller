name: ByteTorque R2 — Deno Edge sin despliegue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/bt-mechanic-*/**'
      - 'supabase/functions/bt-invite-worker/**'
      - 'supabase/config.toml'
      - 'scripts/security/bt-r2-worker-fail-closed.mjs'
      - '.github/workflows/bt-auth-r2-edge-check.yml'
permissions:
  contents: read
jobs:
  deno-offline:
    name: Comprobar tipos Edge y ruta de importación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificar TypeScript Deno de los tres endpoints cerrados
        run: |
          deno check supabase/functions/bt-mechanic-invites/index.ts
          deno check supabase/functions/bt-mechanic-accept/index.ts
          deno check supabase/functions/bt-mechanic-revoke/index.ts
          deno check supabase/functions/_shared/encryptedInviteEnvelope.ts
          deno check supabase/functions/_shared/inviteDeliveryAdapter.ts
          deno check supabase/functions/_shared/invitationEmailWorker.ts
          deno check supabase/functions/_shared/invitationIssueCandidate.ts
          deno check supabase/functions/_shared/mechanicInviteAcceptCandidate.ts
          deno check supabase/functions/_shared/resendInviteWireV1.ts
          deno check supabase/functions/_shared/resendInviteCandidate.ts
          deno check supabase/functions/_shared/resendInviteTransportCandidate.ts
          deno check supabase/functions/bt-invite-worker/index.ts
          deno check supabase/functions/bt-invite-worker/serviceAuthPolicy.ts
          deno check --node-modules-dir=auto supabase/functions/bt-invite-worker/serviceAuthCandidate.ts
      - name: Autenticación M2M con SDK real y claves sintéticas (sin red)
        run: |
          deno test --node-modules-dir=auto --allow-env scripts/security/bt-r2-service-auth-offline.test.ts
      - name: Preservar worker 503 y configuración JWT inactiva
        run: node scripts/security/bt-r2-worker-fail-closed.mjs
      - name: Confirmar que no se desplegó ni envió correo
        run: |
          echo 'PASS: offline typecheck only. No Supabase deploy, RPC or SMTP'
