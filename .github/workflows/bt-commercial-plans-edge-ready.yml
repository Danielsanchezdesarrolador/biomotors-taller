name: ByteTorque PLANS-01 - Edge READY
on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'PLANS_READY_GATE_VERIFIED (solo ready, SQL 0/2/4 instalado, GATE4 cerrado)'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: bytetorque-commercial-edge-release
  cancel-in-progress: false
jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPROVED_SHA: c7e4ace9ed436437a1f4e19ec4816766c4f929d6
      PACKAGE: /tmp/bt-plans-ready-${{ github.run_id }}-${{ github.run_attempt }}
      CONFIRMATION: ${{ inputs.confirmacion }}
      REQUEST_REF: ${{ github.ref }}
    steps:
      - name: Reject any unauthorized ref or confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUEST_REF" == refs/heads/main ]]
          [[ "$CONFIRMATION" == PLANS_READY_GATE_VERIFIED ]]
      - uses: actions/checkout@v4
        with:
          ref: c7e4ace9ed436437a1f4e19ec4816766c4f929d6
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact reviewed sources and packages
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]]
          npm ci --no-audit --no-fund
          git diff --exit-code
          git diff --cached --exit-code
          node scripts/package-commercial-handlers.mjs "$PACKAGE"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {readFile,readdir,writeFile} from 'node:fs/promises'
          import {createHash} from 'node:crypto'
          import {join} from 'node:path'
