      - name: Preserve verified manifest and receipt
        uses: actions/upload-artifact@v4
        with:
          name: commercial-plans-ready-verified-manifest
          path: |
            ${{ env.PACKAGE }}/release-manifest.json
            ${{ env.PACKAGE }}/verify-receipt.json
          if-no-files-found: error
      - uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Install only three reviewed ready handlers
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: suxcqqnmcjoezfxltoms
        run: |
          set -euo pipefail
          [[ "$REQUEST_REF" == refs/heads/main ]]
          [[ "$CONFIRMATION" == PLANS_READY_GATE_VERIFIED ]]
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]]
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]]
          supabase --version
          supabase functions deploy --help >/dev/null
          cd "$PACKAGE/ready"
          for service in bt-cp05-documents bt-final-archive bt-commercial-documents; do
            supabase functions deploy "$service" --project-ref "$PROJECT_REF"
            echo "BT_PLANS_READY_DEPLOYED: $service"
          done
          supabase functions list --project-ref "$PROJECT_REF"
          echo "BT_PLANS_READY: THREE_DEPLOYS_COMPLETE; GATE4_MUST_REMAIN_CLOSED"
