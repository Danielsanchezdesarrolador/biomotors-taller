83873de58563c5d488f954deb282843c3ea79c","ready/supabase/functions/bt-cp05-documents/assets/icon-192.png":"1daa67c7edb94f093ca303461ef4274d00de386843116fc7d6262e85847b4e67","ready/supabase/functions/bt-cp05-documents/index.js":"920ff232c74466528f7dbb0db8d7e54e57b5734402ac3cbd8e2ad47a54254759","ready/supabase/functions/bt-final-archive/assets/DejaVuSans-Bold.ttf":"a4c5bc453ca281d90ea079e596da7ae0dfeb5777497c29ec254e76d97ff6f890","ready/supabase/functions/bt-final-archive/assets/DejaVuSans.ttf":"57f73e11f51999432bf7ab22ce55b6f945d5eca1bf824404cfa9ec2e3718c84e","ready/supabase/functions/bt-final-archive/assets/FONT-LICENSE.txt":"e81d9dced49fea2a7d576cbea283873de58563c5d488f954deb282843c3ea79c","ready/supabase/functions/bt-final-archive/assets/icon-192.png":"1daa67c7edb94f093ca303461ef4274d00de386843116fc7d6262e85847b4e67","ready/supabase/functions/bt-final-archive/assets/wordmark.png":"aeb7f50302d6d641eeadca83373f103feaa177b557ee7680ec95030b2db37e34","ready/supabase/functions/bt-final-archive/index.js":"55285d331027c364fabb4fea18e5405ecd02493cc6dcc2773ceef04e9bbc18ee"},"runtime":"Deno/Supabase Edge, pinned npm imports, JWT verification true","activation":"Freeze and drain ALL old egress before SQL and ready packages. Provider cross-service atomicity is NOT assumed. See candidate checkpoint."}
          const actual = JSON.parse(await readFile(join(process.env.PACKAGE,'release-manifest.json'),'utf8'))
          assert.deepEqual(actual,expected,'REVIEW_MANIFEST_MISMATCH')
          const sha = bytes => createHash('sha256').update(bytes).digest('hex')
          const sourcePaths = Object.keys(expected.sourceHashes)
          const packagePaths = Object.keys(expected.files)
          assert.equal(sourcePaths.length,10)
          assert.equal(packagePaths.length,43)
          for (const [p,h] of Object.entries(expected.sourceHashes)) assert.equal(sha(await readFile(p)),h,p)
          for (const [p,h] of Object.entries(expected.files)) assert.equal(sha(await readFile(join(process.env.PACKAGE,p))),h,p)
          const found = []
          async function walk(root,prefix='') {
            for(const e of await readdir(root,{withFileTypes:true})){
              const relative=prefix+e.name
              if(e.isDirectory()) await walk(join(root,e.name),relative+'/')
              else if(e.isFile()) found.push(relative)
              else throw Error('NON_REGULAR_PACKAGE_ENTRY')
            }
          }
          await walk(process.env.PACKAGE)
          assert.deepEqual(found.sort(),[...packagePaths,'release-manifest.json'].sort(),'PACKAGE_INVENTORY_MISMATCH')
