name: BT-OFICIAL-01A — Interfaz pública y exclusión de fixtures
on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'tests/**', 'vite*.ts', 'vitest.config.ts', 'scripts/**', 'public/**', 'package.json', 'package-lock.json', '.github/workflows/bt-oficial-01.yml']
  workflow_dispatch:
concurrency:
  # En push, solo el HEAD mas nuevo necesita el resultado de este workflow.
  # Las ejecuciones manuales y PR mantienen grupos unicos independientes.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
jobs:
  interfaz-publica:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Preparar pruebas
        run: |
          # Respect the committed application lock; browser tooling must not re-resolve it.
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/bt-oficial-playwright" --no-save --no-package-lock --no-audit --no-fund playwright
          ln -s "$RUNNER_TEMP/bt-oficial-playwright/node_modules/playwright" node_modules/playwright
          node -e 'const locked=require("./package-lock.json").packages["node_modules/vite"].version; const installed=require("vite/package.json").version; if(locked!==installed) throw Error("Vite lock mismatch"); console.log("BT_CI_VITE_LOCK: "+installed)'
          node "$RUNNER_TEMP/bt-oficial-playwright/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Comprobar tipos, modelos y bundle público
        run: |
          npm run typecheck
          npm test
          npm run build
          node scripts/verify-auth-r1-env.mjs
      - name: Cinco paneles y acceso visual en cinco tamaños
        run: |
          npm run preview -- --port 5173 --strictPort > /tmp/bt-oficial-preview.log 2>&1 &
          npm run dev:harness -- --port 5177 --strictPort > /tmp/bt-auth-harness.log 2>&1 &
          if ! curl -fsS --retry 29 --retry-connrefused --retry-delay 1 --max-time 2 http://127.0.0.1:5173/ > /dev/null; then
            echo "BT_CI_PREVIEW_NOT_READY: 5173"
            cat /tmp/bt-oficial-preview.log
            exit 1
          fi
          if ! curl -fsS --retry 29 --retry-connrefused --retry-delay 1 --max-time 2 http://127.0.0.1:5177/ > /dev/null; then
            echo "BT_CI_PREVIEW_NOT_READY: 5177"
            cat /tmp/bt-auth-harness.log
            exit 1
          fi
          node scripts/verify-official-ui.cjs
          node scripts/verify-auth-ui.cjs
          node scripts/verify-auth-r1-ui.cjs
          node scripts/verify-brand-ui.cjs
          node scripts/verify-brand-02-ui.cjs
          node scripts/verify-r2-invite-ui.cjs
          node scripts/verify-ui-polish.cjs
          node scripts/verify-com01d-browser.cjs
      - name: CP04 · Rediseño y autoguardado con HTTP simulado (sin datos alojados)
        run: |
          VITE_BT_AUTH_R1_ENABLED=true VITE_BT_CP03_PRIVATE_ENABLED=true VITE_BT_CP04_PRIVATE_ENABLED=true VITE_SUPABASE_URL=https://suxcqqnmcjoezfxltoms.supabase.co VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_build_only node node_modules/vite/bin/vite.js build --outDir /tmp/bt-cp04-design-build
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --outDir /tmp/bt-cp04-design-build --port 5179 --strictPort > /tmp/bt-cp04-design.log 2>&1 &
          if ! curl -fsS --retry 29 --retry-connrefused --retry-delay 1 --max-time 2 http://127.0.0.1:5179/ > /dev/null; then
            echo "BT_CI_PREVIEW_NOT_READY: 5179"
            cat /tmp/bt-cp04-design.log
            exit 1
          fi
          CP04_BASE_URL=http://127.0.0.1:5179 node scripts/verify-cp04-redesign.cjs
      - name: BT-PILOT-QA-04B · F01–F06 en navegador con HTTP sintético, sin datos alojados
        run: CP04_BASE_URL=http://127.0.0.1:5179 node scripts/verify-pilot-qa04b.cjs
      - name: CP05 móvil · Tarjetas compactas, acciones R2 y total (HTTP simulado)
        run: |
          VITE_BT_AUTH_R1_ENABLED=true VITE_BT_CP03_PRIVATE_ENABLED=true VITE_BT_CP04_PRIVATE_ENABLED=true VITE_BT_CP05_PRIVATE_ENABLED=true VITE_SUPABASE_URL=https://suxcqqnmcjoezfxltoms.supabase.co VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_build_only node node_modules/vite/bin/vite.js build --outDir /tmp/bt-cp05-mobile-build
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --outDir /tmp/bt-cp05-mobile-build --port 5181 --strictPort > /tmp/bt-cp05-mobile.log 2>&1 &
          if ! curl -fsS --retry 29 --retry-connrefused --retry-delay 1 --max-time 2 http://127.0.0.1:5181/ > /dev/null; then
            echo "BT_CI_PREVIEW_NOT_READY: 5181"
            cat /tmp/bt-cp05-mobile.log
            exit 1
          fi
          CP04_BASE_URL=http://127.0.0.1:5181 OUTPUT_DIR=artifacts/cp05-mobile node scripts/verify-cp05-browser.cjs
      - name: UX persistente · Sesión, navegación y formularios con HTTP simulado
        run: |
          VITE_BT_AUTH_R1_ENABLED=true VITE_BT_CP03_PRIVATE_ENABLED=true VITE_BT_CP04_PRIVATE_ENABLED=true VITE_BT_CP05_PRIVATE_ENABLED=true VITE_BT_CP06_PRIVATE_ENABLED=true npm run dev:harness -- --host 127.0.0.1 --port 5183 --strictPort > /tmp/bt-ux-persist.log 2>&1 &
          if ! curl -fsS --retry 29 --retry-connrefused --retry-delay 1 --max-time 2 http://127.0.0.1:5183/ > /dev/null; then
            echo "BT_CI_PREVIEW_NOT_READY: 5183"
            cat /tmp/bt-ux-persist.log
            exit 1
          fi
          CP04_BASE_URL=http://127.0.0.1:5183 node scripts/verify-ux-persist.cjs
          BT_UX_BROWSER=webkit CP04_BASE_URL=http://127.0.0.1:5183 OUTPUT_DIR=artifacts/bt-ux-persist-webkit node scripts/verify-ux-persist.cjs
      - name: R2-A6-10 · Prueba WebKit Linux (NO Safari físico)
        env:
          BT_INVITE_BROWSER: webkit
          OUTPUT_DIR: artifacts/bt-r2-a10-webkit
        run: node scripts/verify-r2-invite-ui.cjs
      - name: Build R1 activado solo en loopback con HTTP simulado (no Auth real)
        run: |
          VITE_BT_AUTH_R1_ENABLED=true VITE_SUPABASE_URL=https://suxcqqnmcjoezfxltoms.supabase.co VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_local_build_mock node node_modules/vite/bin/vite.js build --outDir /tmp/bt-auth-r1-enabled
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --outDir /tmp/bt-auth-r1-enabled --port 5178 --strictPort > /tmp/bt-auth-enabled.log 2>&1 &
          if ! curl -fsS --retry 29 --retry-connrefused --retry-delay 1 --max-time 2 http://127.0.0.1:5178/ > /dev/null; then
            echo "BT_CI_PREVIEW_NOT_READY: 5178"
            cat /tmp/bt-auth-enabled.log
            exit 1
          fi
          AUTH_R1_BASE_URL=http://127.0.0.1:5178 AUTH_R1_ENTRY_PATH=/acceso OUTPUT_DIR=artifacts/bt-auth-01b-r1-production-mock node scripts/verify-auth-r1-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BT-OFICIAL-01A-Estados-vacios-Capturas
          path: |
            artifacts/bt-ux-persist/
            artifacts/bt-ux-persist-webkit/
            artifacts/cp04-redesign/
            artifacts/bt-pilot-qa04b/
            artifacts/cp05-mobile/
            artifacts/bt-ui-polish/
            artifacts/bt-com-01d/
            artifacts/bt-oficial-01a/
            artifacts/bt-auth-01a/
            artifacts/bt-auth-01b-r1/
            artifacts/bt-auth-01b-r1-production-mock/
            artifacts/bt-brand-01/
            artifacts/bt-brand-02/
            artifacts/bt-r2-a5/
            artifacts/bt-r2-a10-webkit/
          if-no-files-found: warn
          retention-days: 30
  live-personal-workshop:
    name: LIVE-FIX-01 · cuenta personal y planes (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      BT_LIVE_PERSONAL_BROWSER: ${{ matrix.browser }}
      LIVE_PERSONAL_URL: http://127.0.0.1:5241
      OUTPUT_DIR: artifacts/bt-live-personal-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Preparar navegador y aplicación
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/bt-live-personal-playwright" --no-save --no-package-lock --no-audit --no-fund playwright
          ln -s "$RUNNER_TEMP/bt-live-personal-playwright/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/bt-live-personal-playwright/node_modules/playwright/cli.js" install --with-deps "$BT_LIVE_PERSONAL_BROWSER"
      - name: Build privado sintético y regresión de planes
        env:
          VITE_BT_AUTH_R1_ENABLED: 'true'
          VITE_BT_CREATOR_PRIVATE_ENABLED: 'true'
          VITE_BT_PLAN04_PRIVATE_ENABLED: 'true'
          VITE_BT_PLAN04_WORKSHOPS_ENABLED: 'true'
          VITE_BT_CP03_PRIVATE_ENABLED: 'true'
          VITE_BT_CP04_PRIVATE_ENABLED: 'true'
          VITE_SUPABASE_URL: https://suxcqqnmcjoezfxltoms.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_build_mock
        run: |
          node node_modules/vite/bin/vite.js build --outDir /tmp/bt-live-personal-build
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --outDir /tmp/bt-live-personal-build --port 5241 --strictPort > /tmp/bt-live-personal.log 2>&1 &
          if ! curl -fsS --retry 29 --retry-connrefused --retry-delay 1 --max-time 2 "$LIVE_PERSONAL_URL/" > /dev/null; then
            cat /tmp/bt-live-personal.log
            exit 1
          fi
          node scripts/verify-live-personal-workshop.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BT-LIVE-FIX-01-${{ matrix.browser }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: warn
          retention-days: 30
